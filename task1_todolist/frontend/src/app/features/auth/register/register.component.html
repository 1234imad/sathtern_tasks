<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-lg" style="width: 100%; max-width: 420px;">
    <div class="card-body p-5">
      <h2 class="text-center mb-4">
        <i class="bi bi-person-plus text-primary"></i>
        Inscription
      </h2>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Nom d'utilisateur</label>
          <input
            type="text"
            id="username"
            class="form-control"
            [(ngModel)]="data.username"
            name="username"
            required
            minlength="3"
            placeholder="Votre pseudo"
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            [(ngModel)]="data.email"
            name="email"
            required
            placeholder="votre@email.com"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mot de passe</label>
          <input
            type="password"
            id="password"
            class="form-control"
            [(ngModel)]="data.password"
            name="password"
            required
            minlength="6"
            placeholder="••••••••"
          />
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            placeholder="••••••••"
          />
        </div>

        <div *ngIf="error" class="alert alert-danger py-2">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mb-3"
          [disabled]="!registerForm.form.valid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Inscription...' : 'S\'inscrire' }}
        </button>

        <p class="text-center text-muted mb-0">
          Déjà un compte ?
          <a routerLink="/login" class="text-decoration-none">Se connecter</a>
        </p>
      </form>
    </div>
  </div>
</div>
