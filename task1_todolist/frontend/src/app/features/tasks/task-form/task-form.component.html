<div class="container py-4" style="max-width: 640px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h2 class="h4 mb-4">
        <i class="bi text-primary" [ngClass]="isEdit ? 'bi-pencil-square' : 'bi-plus-circle'"></i>
        {{ isEdit ? 'Modifier la tâche' : 'Nouvelle tâche' }}
      </h2>

      <form (ngSubmit)="onSubmit()" #taskForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Titre *</label>
          <input type="text" class="form-control"
            [(ngModel)]="form.title" name="title" required
            placeholder="Titre de la tâche" />
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control"
            [(ngModel)]="form.description" name="description"
            rows="3" placeholder="Description (optionnelle)"></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Priorité</label>
            <select class="form-select" [(ngModel)]="form.priority" name="priority">
              <option [ngValue]="TaskPriority.Low">Basse</option>
              <option [ngValue]="TaskPriority.Medium">Moyenne</option>
              <option [ngValue]="TaskPriority.High">Haute</option>
            </select>
          </div>

          <div class="col-md-6 mb-3" *ngIf="isEdit">
            <label class="form-label">Statut</label>
            <select class="form-select" [(ngModel)]="form.status" name="status">
              <option [ngValue]="TaskStatus.Todo">À faire</option>
              <option [ngValue]="TaskStatus.InProgress">En cours</option>
              <option [ngValue]="TaskStatus.Done">Terminée</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Date d'échéance</label>
          <input type="date" class="form-control"
            [(ngModel)]="form.dueDate" name="dueDate" />
        </div>

        <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary flex-fill"
            [disabled]="!taskForm.form.valid || loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isEdit ? 'Enregistrer' : 'Créer' }}
          </button>
          <a routerLink="/tasks" class="btn btn-outline-secondary">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
