<div class="container py-4" style="max-width: 720px;">
  <!-- Loading (mode édition) -->
  <div *ngIf="loading && isEdit && !form.firstName" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Chargement...</p>
  </div>

  <!-- Formulaire -->
  <div class="card shadow-sm" *ngIf="!loading || !isEdit || form.firstName">
    <div class="card-body p-4">
      <h2 class="h4 mb-4">
        <i class="bi text-primary"
           [ngClass]="isEdit ? 'bi-pencil-square' : 'bi-person-plus'"></i>
        {{ isEdit ? 'Modifier l\'étudiant' : 'Nouvel étudiant' }}
      </h2>

      <form (ngSubmit)="onSubmit()" #formRef="ngForm">
        <!-- Prénom + Nom -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Prénom *</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="form.firstName"
              name="firstName"
              required
              placeholder="Ahmed"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Nom *</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="form.lastName"
              name="lastName"
              required
              placeholder="Benali"
            />
          </div>
        </div>

        <!-- Email + Téléphone -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Email *</label>
            <input
              type="email"
              class="form-control"
              [(ngModel)]="form.email"
              name="email"
              required
              placeholder="ahmed@test.com"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Téléphone</label>
            <input
              type="tel"
              class="form-control"
              [(ngModel)]="form.phone"
              name="phone"
              placeholder="0612345678"
            />
          </div>
        </div>

        <!-- Date naissance + Filière -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Date de naissance</label>
            <input
              type="date"
              class="form-control"
              [(ngModel)]="form.dateOfBirth"
              name="dateOfBirth"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Filière *</label>
            <select
              class="form-select"
              [(ngModel)]="form.major"
              name="major"
              required>
              <option value="">-- Choisir --</option>
              <option *ngFor="let m of majors" [value]="m">{{ m }}</option>
            </select>
          </div>
        </div>

        <!-- Adresse + GPA -->
        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label">Adresse</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="form.address"
              name="address"
              placeholder="123 Rue de Fès, Casablanca"
            />
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">GPA (0 - 4)</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="form.gpa"
              name="gpa"
              min="0"
              max="4"
              step="0.01"
              placeholder="3.75"
            />
          </div>
        </div>

        <!-- Erreur -->
        <div *ngIf="error" class="alert alert-danger py-2">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>

        <!-- Boutons -->
        <div class="d-flex gap-2 mt-4">
          <button
            type="submit"
            class="btn btn-primary flex-fill"
            [disabled]="!formRef.form.valid || loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            <i class="bi bi-check-lg"></i>
            {{ isEdit ? 'Enregistrer' : 'Créer l\'étudiant' }}
          </button>
          <a routerLink="/students" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg"></i> Annuler
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
